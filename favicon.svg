<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="planetGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7B2CBF"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
    <radialGradient id="planetSphere" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0B0D13"/>
    </radialGradient>
    <linearGradient id="ringGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Ring Behind Planet -->
  <ellipse cx="32" cy="32" rx="28" ry="10" transform="rotate(-25 32 32)" stroke="url(#ringGlow)" stroke-width="3" fill="none" opacity="0.6" stroke-dasharray="88 40" />
  <!-- Planet Body -->
  <circle cx="32" cy="32" r="18" fill="url(#planetSphere)" stroke="#38BDF8" stroke-width="1.5" filter="url(#neon)"/>
  <!-- Planet Inner Shading Band -->
  <path d="M 17 38 Q 32 44 47 38 Q 32 41 17 38 Z" fill="#38BDF8" opacity="0.4"/>
  <!-- Front Ring Segment -->
  <ellipse cx="32" cy="32" rx="28" ry="10" transform="rotate(-25 32 32)" stroke="url(#ringGlow)" stroke-width="3.5" fill="none" filter="url(#neon)" stroke-dasharray="40 88" stroke-dashoffset="-44"/>
  <!-- Center Energy Core -->
  <circle cx="28" cy="26" r="3" fill="#FFFFFF" opacity="0.8" filter="url(#neon)"/>
</svg>
