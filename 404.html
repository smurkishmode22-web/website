<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Planet Tweaks</title>
  <meta name="description" content="The page you are looking for does not exist. Return to Planet Tweaks for the ultimate Windows esports optimization suite.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/x-icon" href="/downloads/favicon.ico">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at 50% 20%, #151821 0%, #07080B 100%);
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .error-container {
      background: rgba(18, 22, 34, 0.75);
      border: 1px solid rgba(255, 122, 0, 0.25);
      border-radius: 20px;
      padding: 48px 36px;
      max-width: 520px;
      width: 100%;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 122, 0, 0.1);
    }
    .error-code {
      font-size: 80px;
      font-weight: 900;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #FF7A00 0%, #FFE600 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 8px 0;
      line-height: 1;
    }
    .error-title {
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      margin: 0 0 14px 0;
    }
    .error-desc {
      font-size: 14.5px;
      line-height: 1.6;
      color: #94A3B8;
      margin: 0 0 32px 0;
    }
    .btn-home {
      display: inline-block;
      background: linear-gradient(135deg, #FF7A00 0%, #FF5500 100%);
      color: #000000;
      font-weight: 700;
      font-size: 14px;
      padding: 14px 28px;
      border-radius: 10px;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 20px rgba(255, 122, 0, 0.35);
    }
    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 122, 0, 0.5);
    }
    .quick-links {
      margin-top: 24px;
      display: flex;
      gap: 16px;
      justify-content: center;
      font-size: 13px;
    }
    .quick-links a {
      color: #38BDF8;
      text-decoration: none;
    }
    .quick-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Signal Lost in Deep Space</h1>
    <p class="error-desc">The page or resource you requested could not be found. It may have been relocated, updated, or purged in a latency optimization pass.</p>
    <a href="/" class="btn-home">⚡ Return to Planet Tweaks Home</a>
    <div class="quick-links">
      <a href="/#download">Downloads</a>
      <a href="/#features">Features</a>
      <a href="/login.html">Cloud GamerTag</a>
    </div>
  </div>
</body>
</html>
