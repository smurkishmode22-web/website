<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Planet Tweaks Cloud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #06080E;
            color: #F8FAFC;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 24px;
            overflow-x: hidden;
            position: relative;
        }
        .login-card {
            background: rgba(14, 19, 31, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.2);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            padding: 48px 40px;
            width: 100%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(56, 189, 248, 0.1);
            position: relative;
            z-index: 10;
        }
        .login-logo {
            font-size: 42px;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.5));
        }
        .login-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #FFFFFF;
            margin: 0 0 8px;
            text-transform: uppercase;
        }
        .login-title span {
            background: linear-gradient(135deg, #38BDF8 0%, #00FFCC 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-subtitle {
            color: #94A3B8;
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 32px;
        }
        .btn-google {
            background: #FFFFFF;
            color: #0F172A;
            border: none;
            border-radius: 14px;
            padding: 16px 24px;
            font-size: 15px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }
        .btn-google:hover {
            background: #F1F5F9;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45), 0 0 20px rgba(255, 255, 255, 0.2);
        }
        .btn-google:active {
            transform: translateY(0);
        }
        .status-pill {
            margin-top: 24px;
            padding: 16px;
            border-radius: 14px;
            font-size: 13.5px;
            line-height: 1.5;
            display: none;
        }
        .status-loading {
            background: rgba(14, 165, 233, 0.1);
            border: 1px solid rgba(14, 165, 233, 0.3);
            color: #38BDF8;
        }
        .status-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10B981;
        }
        .status-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #F87171;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #38BDF8;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .back-link {
            display: inline-block;
            margin-top: 28px;
            color: #64748B;
            font-size: 13px;
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #38BDF8;
        }
    </style>
</head>
<body class="oled-theme">
    <div class="glow-orb glow-top"></div>
    <div class="glow-orb glow-bottom"></div>

    <div class="login-card" id="loginCard">
        <div class="login-logo">🪐</div>
        <h1 class="login-title">Planet <span>Tweaks</span></h1>
        <p class="login-subtitle">Sign in with your Google account to sync your esports presets, GamerTag, and zero-latency configs across devices.</p>

        <button class="btn-google" id="googleBtn" onclick="handleGoogleSignIn()">
            <svg width="20" height="20" viewBox="0 0 18 18">
                <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
                <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
                <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.173 0 7.548 0 9s.347 2.827.957 4.039l3.007-2.332z"/>
                <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
            </svg>
            Sign In with Google
        </button>

        <div id="statusPill" class="status-pill"></div>

        <a href="index.html" class="back-link">← Return to Planet Tweaks Home</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://rgycceantliyebnagtub.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJneWNjZWFudGxpeWVibmFndHViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1Mzg0NDcsImV4cCI6MjEwODExNDQ0N30.AlFQ-0-NBcrAWp6y1zoiey641QQ_M7yqR-npTpFCp1E";

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const callbackPort = urlParams.get('port') || '51789';
        const googleBtn = document.getElementById('googleBtn');
        const statusPill = document.getElementById('statusPill');

        async function syncSessionWithDesktop(user, session) {
            const payload = {
                idToken: session?.access_token || '',
                refreshToken: session?.refresh_token || '',
                email: user.email || '',
                displayName: user.user_metadata?.full_name || user.user_metadata?.name || (user.email ? user.email.split('@')[0] : 'PlanetGamer'),
                localId: user.id || '',
                photoUrl: user.user_metadata?.avatar_url || ''
            };

            statusPill.innerHTML = '<span class="spinner"></span> Syncing with Planet Tweaks Desktop...';

            try {
                const response = await fetch(`http://127.0.0.1:${callbackPort}/callback`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    statusPill.className = 'status-pill status-success';
                    document.getElementById('loginCard').innerHTML = `
                        <div class="login-logo" style="color: #10B981;">✅</div>
                        <h1 class="login-title" style="color: #10B981;">AUTHENTICATED!</h1>
                        <p class="login-subtitle">Welcome back, <strong>${payload.displayName}</strong>!<br>Your cloud session is now active in Planet Tweaks.</p>
                        <p style="font-size: 13px; color: #38BDF8; font-weight: 600;">You can close this tab and return to the app.</p>
                    `;
                    return true;
                }
            } catch (desktopErr) {
                console.log('Desktop listener not reachable or web-only sign in:', desktopErr);
            }

            statusPill.className = 'status-pill status-success';
            statusPill.innerHTML = `<strong>✓ Welcome, ${payload.displayName}!</strong><br>Logged in successfully.`;
            return false;
        }

        window.handleGoogleSignIn = async function() {
            googleBtn.style.display = 'none';
            statusPill.style.display = 'block';
            statusPill.className = 'status-pill status-loading';
            statusPill.innerHTML = '<span class="spinner"></span> Connecting to Google...';

            try {
                const redirectTo = window.location.origin + window.location.pathname + (callbackPort ? `?port=${callbackPort}` : '');
                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: redirectTo,
                        queryParams: {
                            prompt: 'select_account'
                        }
                    }
                });

                if (error) throw error;
            } catch (err) {
                console.error(err);
                googleBtn.style.display = 'flex';
                statusPill.className = 'status-pill status-error';
                statusPill.innerHTML = '⚠️ ' + (err.message || 'Google sign-in was cancelled or blocked.');
            }
        };

        // Check for session on return from OAuth or auto-login
        window.addEventListener('load', async () => {
            try {
                const { data: { session }, error } = await supabase.auth.getSession();
                if (session && session.user) {
                    googleBtn.style.display = 'none';
                    statusPill.style.display = 'block';
                    statusPill.className = 'status-pill status-loading';
                    await syncSessionWithDesktop(session.user, session);
                } else if (urlParams.has('port') && !window.location.hash.includes('access_token')) {
                    // Automatically trigger Google sign in if opened from the app without a session
                    setTimeout(() => {
                        handleGoogleSignIn();
                    }, 400);
                }
            } catch (e) {
                console.warn('Session check error:', e);
            }
        });
    </script>
</body>
</html>
